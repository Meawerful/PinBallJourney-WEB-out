name: Publish web game
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Web release tag to publish
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p site/play
          gh release download "$RELEASE_TAG" --pattern pinball_journey_web.zip
          unzip -q pinball_journey_web.zip -d site/play
          test -s site/play/index.html
          test -s site/play/index.wasm
          test -s site/play/index.pck
          cp PinballJourneyV0.63.* site/
          cp pages/index.html site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
