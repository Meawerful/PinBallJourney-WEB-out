name: Publish web game
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Web release tag to publish
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p site/play
          gh release download "$RELEASE_TAG" --pattern pinball_journey_web.zip
          unzip -q pinball_journey_web.zip -d site/play
          test -s site/play/index.html
          test -s site/play/index.wasm
          test -s site/play/index.pck
          cp PinballJourneyV0.63.* site/
          cp pages/index.html site/index.html
          python - <<'PY'
          from pathlib import Path

          snippet = Path("pages/clarity.html").read_text(encoding="utf-8").strip()
          for page in (Path("site/play/index.html"), Path("site/PinballJourneyV0.63.html")):
              html = page.read_text(encoding="utf-8")
              if snippet in html:
                  continue
              if html.count("</head>") != 1:
                  raise ValueError(f"Expected a single </head> in {page}")
              page.write_text(html.replace("</head>", snippet + "\n</head>"), encoding="utf-8")
          PY
      - id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          for attempt in {1..30}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[].id' | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 4
          done
          echo "::error::Pages artifact $ARTIFACT_ID did not appear in the workflow run."
          exit 1
      - id: deploy
        uses: actions/deploy-pages@v4
